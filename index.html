<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#111827"
  >

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <title>Mini Soundboard</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-width: 280px;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;
    }

    body {
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      padding: 6px;
    }

    .app {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 7px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      margin-bottom: 6px;
    }

    h1 {
      margin: 0;
      font-size: 15px;
      line-height: 1;
    }

    .subtitle {
      color: #9ca3af;
      font-size: 9px;
      margin-top: 3px;
    }

    button {
      border: 0;
      cursor: pointer;
      color: white;
      border-radius: 6px;
      font-family: Arial, sans-serif;
    }

    .add {
      background: #2563eb;
      padding: 6px 8px;
      font-size: 11px;
    }

    .drop {
      border: 1px dashed #4b5563;
      border-radius: 7px;
      padding: 7px;
      text-align: center;
      color: #cbd5e1;
      font-size: 10px;
      margin-bottom: 6px;
      cursor: pointer;
    }

    .drop.over {
      background: #263449;
      border-color: #60a5fa;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 6px;
      height: 25px;
    }

    .controls span {
      font-size: 12px;
    }

    .controls input {
      flex: 1;
      min-width: 0;
      height: 16px;
    }

    .stop {
      background: #991b1b;
      padding: 5px 7px;
      font-size: 10px;
    }

    .sounds {
      display: grid;
      gap: 4px;
      max-height: 360px;
      overflow-y: auto;
    }

    .sound {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 3px;
      align-items: center;
      background: #111827;
      border-radius: 6px;
      padding: 3px;
    }

    .play {
      background: #2563eb;
      padding: 6px 7px;
      text-align: left;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      font-size: 10px;
      min-width: 0;
    }

    .shortcut {
      background: #374151;
      padding: 5px 6px;
      min-width: 30px;
      max-width: 60px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 9px;
    }

    .edit {
      background: #374151;
      padding: 5px;
      font-size: 10px;
    }

    .delete {
      background: #7f1d1d;
      padding: 5px;
      font-size: 10px;
    }

    .edit-area {
      display: none;
      grid-column: 1 / -1;
      gap: 3px;
    }

    .sound.editing .edit-area {
      display: flex;
    }

    .edit-area input {
      min-width: 0;
      flex: 1;
      background: #111827;
      border: 1px solid #4b5563;
      color: white;
      border-radius: 5px;
      padding: 5px;
      font-size: 10px;
    }

    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 14px 5px;
      font-size: 10px;
    }

    footer {
      text-align: center;
      color: #6b7280;
      font-size: 8px;
      margin-top: 5px;
    }

  </style>
</head>

<body>

<div class="app">

  <header>

    <div>
      <h1>🎵 Soundboard</h1>

      <div class="subtitle">
        Compact • raccourcis
      </div>
    </div>

    <button
      class="add"
      id="addButton"
    >
      ＋ Son
    </button>

  </header>

  <div
    class="drop"
    id="dropZone"
  >
    🎵 Glisse un son ici ou clique
  </div>

  <input
    id="fileInput"
    type="file"
    accept="audio/*"
    multiple
    hidden
  >

  <div class="controls">

    <span>🔊</span>

    <input
      id="volume"
      type="range"
      min="0"
      max="1"
      step="0.01"
      value="0.8"
    >

    <button
      class="stop"
      id="stopButton"
    >
      ■ Stop
    </button>

  </div>

  <div
    class="sounds"
    id="sounds"
  ></div>

  <footer>
    Échap = arrêter
  </footer>

</div>


<script>

const DATABASE_NAME = "MiniSoundboard";

const STORE_NAME = "sounds";

let database;

let volume = 0.8;

let playingSounds = new Set();

let shortcutCapture = null;


/* DATABASE */

function openDatabase() {

  return new Promise((resolve, reject) => {

    const request =
      indexedDB.open(
        DATABASE_NAME,
        2
      );

    request.onupgradeneeded =
      function () {

        const db =
          request.result;

        if (
          !db.objectStoreNames
            .contains(STORE_NAME)
        ) {

          db.createObjectStore(
            STORE_NAME,
            {
              keyPath: "id",
              autoIncrement: true
            }
          );

        }

      };

    request.onsuccess =
      function () {

        database =
          request.result;

        resolve();

      };

    request.onerror =
      function () {

        reject(
          request.error
        );

      };

  });

}


/* GET SOUNDS */

function getSounds() {

  return new Promise(
    (resolve, reject) => {

      const transaction =
        database.transaction(
          STORE_NAME,
          "readonly"
        );

      const store =
        transaction.objectStore(
          STORE_NAME
        );

      const request =
        store.getAll();

      request.onsuccess =
        () => resolve(
          request.result
        );

      request.onerror =
        () => reject(
          request.error
        );

    }
  );

}


/* SAVE */

function saveSound(sound) {

  return new Promise(
    (resolve, reject) => {

      const transaction =
        database.transaction(
          STORE_NAME,
          "readwrite"
        );

      const store =
        transaction.objectStore(
          STORE_NAME
        );

      const request =
        store.put(sound);

      request.onsuccess =
        resolve;

      request.onerror =
        () => reject(
          request.error
        );

    }
  );

}


/* DELETE */

function deleteSound(id) {

  const transaction =
    database.transaction(
      STORE_NAME,
      "readwrite"
    );

  transaction
    .objectStore(STORE_NAME)
    .delete(id);

  setTimeout(
    renderSounds,
    100
  );

}


/* SHORTCUT */

function normalizeKey(event) {

  return {

    key:
      event.key.toLowerCase(),

    ctrl:
      event.ctrlKey,

    alt:
      event.altKey,

    shift:
      event.shiftKey,

    meta:
      event.metaKey

  };

}


function shortcutText(shortcut) {

  if (!shortcut) {
    return "—";
  }

  const parts = [];

  if (shortcut.ctrl) {
    parts.push("Ctrl");
  }

  if (shortcut.alt) {
    parts.push("Alt");
  }

  if (shortcut.shift) {
    parts.push("Shift");
  }

  if (shortcut.meta) {
    parts.push("⌘");
  }

  parts.push(shortcut.key);

  return parts.join("+");

}


function sameShortcut(a, b) {

  if (!a || !b) {
    return false;
  }

  return (

    a.key === b.key &&

    a.ctrl === b.ctrl &&

    a.alt === b.alt &&

    a.shift === b.shift &&

    a.meta === b.meta

  );

}


/* PLAY */

function playSound(sound) {

  const url =
    URL.createObjectURL(
      sound.blob
    );

  const audio =
    new Audio(url);

  audio.volume =
    volume;

  playingSounds.add(
    audio
  );

  audio.onended =
    function () {

      playingSounds.delete(
        audio
      );

      URL.revokeObjectURL(
        url
      );

    };

  audio.play();

}


/* ADD FILES */

async function addFiles(files) {

  for (
    const file of files
  ) {

    if (
      !file.type.startsWith(
        "audio/"
      )
    ) {

      continue;

    }

    const name =
      file.name.replace(
        /\.[^/.]+$/,
        ""
      );

    await saveSound({

      name:
        name,

      blob:
        file,

      shortcut:
        null

    });

  }

  renderSounds();

}


/* DISPLAY */

async function renderSounds() {

  const container =
    document.getElementById(
      "sounds"
    );

  const sounds =
    await getSounds();

  container.innerHTML =
    "";

  if (
    sounds.length === 0
  ) {

    container.innerHTML =
      '<div class="empty">Aucun son</div>';

    return;

  }

  for (
    const sound of sounds
  ) {

    const row =
      document.createElement(
        "div"
      );

    row.className =
      "sound";


    /* PLAY */

    const play =
      document.createElement(
        "button"
      );

    play.className =
      "play";

    play.textContent =
      "▶ " + sound.name;

    play.onclick =
      () => playSound(sound);


    /* SHORTCUT */

    const shortcut =
      document.createElement(
        "button"
      );

    shortcut.className =
      "shortcut";

    shortcut.textContent =
      shortcutText(
        sound.shortcut
      );

    shortcut.onclick =
      () => {

        shortcutCapture =
          sound.id;

        shortcut.textContent =
          "Appuie";

      };


    /* EDIT */

    const edit =
      document.createElement(
        "button"
      );

    edit.className =
      "edit";

    edit.textContent =
      "✎";

    edit.onclick =
      () =>
        row.classList.toggle(
          "editing"
        );


    /* DELETE */

    const remove =
      document.createElement(
        "button"
      );

    remove.className =
      "delete";

    remove.textContent =
      "×";

    remove.onclick =
      () =>
        deleteSound(
          sound.id
        );


    /* EDIT AREA */

    const editArea =
      document.createElement(
        "div"
      );

    editArea.className =
      "edit-area";


    const nameInput =
      document.createElement(
        "input"
      );

    nameInput.value =
      sound.name;


    const save =
      document.createElement(
        "button"
      );

    save.className =
      "edit";

    save.textContent =
      "OK";

    save.onclick =
      async () => {

        sound.name =
          nameInput.value.trim()
          || "Son";

        await saveSound(
          sound
        );

        renderSounds();

      };


    editArea.append(
      nameInput,
      save
    );


    row.append(
      play,
      shortcut,
      edit,
      remove,
      editArea
    );

    container.appendChild(
      row
    );

  }

}


/* ADD BUTTON */

document
  .getElementById(
    "addButton"
  )
  .onclick =
  () =>
    document
      .getElementById(
        "fileInput"
      )
      .click();


/* FILE INPUT */

document
  .getElementById(
    "fileInput"
  )
  .onchange =
  e =>
    addFiles(
      e.target.files
    );


/* VOLUME */

document
  .getElementById(
    "volume"
  )
  .oninput =
  e =>
    volume =
      Number(
        e.target.value
      );


/* STOP */

document
  .getElementById(
    "stopButton"
  )
  .onclick =
  () => {

    for (
      const audio
      of playingSounds
    ) {

      audio.pause();

      audio.currentTime =
        0;

    }

  };


/* DRAG DROP */

const dropZone =
  document.getElementById(
    "dropZone"
  );

dropZone.onclick =
  () =>
    document
      .getElementById(
        "fileInput"
      )
      .click();


dropZone.ondragover =
  e => {

    e.preventDefault();

    dropZone.classList.add(
      "over"
    );

  };


dropZone.ondragleave =
  () =>
    dropZone.classList.remove(
      "over"
    );


dropZone.ondrop =
  e => {

    e.preventDefault();

    dropZone.classList.remove(
      "over"
    );

    addFiles(
      e.dataTransfer.files
    );

  };


/* KEYBOARD */

document.addEventListener(
  "keydown",
  async function(event) {

    if (
      event.key ===
      "Escape"
    ) {

      document
        .getElementById(
          "stopButton"
        )
        .click();

      return;

    }


    if (
      shortcutCapture !== null
    ) {

      event.preventDefault();

      const sounds =
        await getSounds();

      const sound =
        sounds.find(
          s =>
            s.id ===
            shortcutCapture
        );

      if (sound) {

        sound.shortcut =
          normalizeKey(
            event
          );

        await saveSound(
          sound
        );

      }

      shortcutCapture =
        null;

      renderSounds();

      return;

    }


    const pressed =
      normalizeKey(event);

    const sounds =
      await getSounds();

    const sound =
      sounds.find(
        s =>
          sameShortcut(
            s.shortcut,
            pressed
          )
      );

    if (sound) {

      event.preventDefault();

      playSound(sound);

    }

  }
);


/* START */

openDatabase()
  .then(
    renderSounds
  );


/* SERVICE WORKER */

if (
  "serviceWorker"
  in navigator
) {

  navigator.serviceWorker.register(
    "./sw.js"
  );

}

</script>

</body>
</html>
