<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0b1020"
  >

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <title>Mini Soundboard</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #0b1020;
      --panel: #131a2e;
      --panel2: #1a2340;
      --line: #2f3b63;
      --blue: #3b82f6;
      --blue2: #60a5fa;
      --red: #dc2626;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-width: 280px;
      background:
        radial-gradient(circle at top, #15203c 0%, var(--bg) 55%);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    body {
      width: 100%;
      max-width: 370px;
      margin: 0 auto;
      padding: 7px;
      overflow-x: hidden;
    }

    .app {
      position: relative;
      background:
        linear-gradient(
          180deg,
          rgba(255,255,255,.03),
          rgba(255,255,255,.01)
        ),
        var(--panel);

      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 8px;

      box-shadow:
        0 12px 30px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.04);

      overflow: hidden;
    }

    .app::before {
      content: "";
      position: absolute;
      inset: -80px;
      background:
        radial-gradient(
          circle,
          rgba(59,130,246,.12),
          transparent 55%
        );
      pointer-events: none;
      animation: breathe 5s ease-in-out infinite;
    }

    @keyframes breathe {
      0%,100% {
        transform: scale(.95);
        opacity: .6;
      }

      50% {
        transform: scale(1.05);
        opacity: 1;
      }
    }

    header {
      position: relative;
      z-index: 1;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 6px;
      margin-bottom: 7px;
    }

    h1 {
      margin: 0;
      font-size: 15px;
      line-height: 1;
      letter-spacing: .2px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 9px;
      margin-top: 3px;
    }

    button {
      position: relative;
      overflow: hidden;

      border: 0;
      color: white;
      cursor: pointer;

      border-radius: 8px;

      font-family: Arial, sans-serif;

      transition:
        transform .08s ease,
        box-shadow .12s ease,
        filter .12s ease;
    }

    button:hover {
      filter: brightness(1.08);
    }

    button:active,
    button.pressed {
      transform: scale(.94);
    }

    button::after {
      content: "";
      position: absolute;

      width: 10px;
      height: 10px;

      border-radius: 50%;

      background: rgba(255,255,255,.7);

      transform:
        translate(-50%, -50%)
        scale(0);

      opacity: 0;

      pointer-events: none;
    }

    button.ripple::after {
      left: var(--ripple-x);
      top: var(--ripple-y);

      animation:
        ripple .45s ease-out;
    }

    @keyframes ripple {
      0% {
        transform:
          translate(-50%, -50%)
          scale(0);

        opacity: .55;
      }

      100% {
        transform:
          translate(-50%, -50%)
          scale(16);

        opacity: 0;
      }
    }

    .add {
      background:
        linear-gradient(
          180deg,
          #4f8ff8,
          #2563eb
        );

      padding: 6px 8px;
      font-size: 11px;

      box-shadow:
        0 4px 12px rgba(37,99,235,.35);
    }

    .add:active {
      box-shadow:
        0 2px 6px rgba(37,99,235,.25);
    }

    .drop {
      position: relative;
      z-index: 1;

      border:
        1px dashed #43527e;

      border-radius: 8px;

      padding: 8px;

      text-align: center;

      color: #cbd5e1;

      font-size: 10px;

      margin-bottom: 6px;

      cursor: pointer;

      transition:
        background .2s,
        border-color .2s,
        transform .12s,
        box-shadow .2s;
    }

    .drop:hover {
      background: #18213c;
      border-color: var(--blue2);
    }

    .drop.over {
      background: #1a294b;
      border-color: #60a5fa;

      transform: scale(1.01);

      box-shadow:
        0 0 20px rgba(96,165,250,.18);
    }

    .controls {
      position: relative;
      z-index: 1;

      display: flex;
      align-items: center;

      gap: 5px;

      margin-bottom: 6px;

      height: 27px;
    }

    .controls span {
      font-size: 12px;
    }

    .controls input {
      flex: 1;
      min-width: 0;
    }

    input[type="range"] {
      accent-color: var(--blue2);
    }

    .stop {
      background:
        linear-gradient(
          180deg,
          #ef4444,
          #991b1b
        );

      padding: 5px 8px;
      font-size: 10px;

      box-shadow:
        0 4px 12px rgba(220,38,38,.22);
    }

    .sounds {
      position: relative;
      z-index: 1;

      display: grid;
      gap: 4px;

      max-height: 380px;

      overflow-y: auto;
      overflow-x: hidden;

      padding-right: 1px;
    }

    .sound {
      position: relative;

      display: grid;

      grid-template-columns:
        1fr auto auto auto;

      gap: 3px;

      align-items: center;

      background:
        linear-gradient(
          180deg,
          #11192d,
          #0d1425
        );

      border:
        1px solid rgba(255,255,255,.03);

      border-radius: 8px;

      padding: 4px;

      transition:
        transform .15s,
        box-shadow .15s,
        border-color .15s;
    }

    .sound.playing {
      border-color:
        rgba(96,165,250,.65);

      box-shadow:
        0 0 18px rgba(59,130,246,.22);

      animation:
        pulseSound .55s ease;
    }

    @keyframes pulseSound {
      0% {
        transform: scale(1);
      }

      35% {
        transform: scale(1.015);
      }

      100% {
        transform: scale(1);
      }
    }

    .play {
      background:
        linear-gradient(
          180deg,
          #3b82f6,
          #2563eb
        );

      padding: 7px 8px;

      text-align: left;

      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;

      font-size: 10px;

      min-width: 0;

      box-shadow:
        0 3px 9px rgba(37,99,235,.23);
    }

    .play.flash {
      animation:
        flashPlay .25s ease;
    }

    @keyframes flashPlay {
      0% {
        filter: brightness(1);
      }

      40% {
        filter: brightness(1.6);
      }

      100% {
        filter: brightness(1);
      }
    }

    .shortcut {
      background:
        linear-gradient(
          180deg,
          #475569,
          #334155
        );

      padding: 5px 6px;

      min-width: 32px;
      max-width: 62px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      font-size: 9px;
    }

    .edit {
      background:
        linear-gradient(
          180deg,
          #475569,
          #334155
        );

      padding: 5px;
      font-size: 10px;
    }

    .delete {
      background:
        linear-gradient(
          180deg,
          #b91c1c,
          #7f1d1d
        );

      padding: 5px;
      font-size: 10px;
    }

    .edit-area {
      display: none;

      grid-column: 1 / -1;

      gap: 3px;

      margin-top: 2px;
    }

    .sound.editing
    .edit-area {
      display: flex;
    }

    .edit-area input {
      min-width: 0;
      flex: 1;

      background: #0b1020;

      border:
        1px solid #425071;

      color: white;

      border-radius: 6px;

      padding: 5px;

      font-size: 10px;

      outline: none;
    }

    .edit-area input:focus {
      border-color:
        var(--blue2);

      box-shadow:
        0 0 0 2px
        rgba(96,165,250,.12);
    }

    .empty {
      text-align: center;

      color: var(--muted);

      padding: 15px 5px;

      font-size: 10px;
    }

    footer {
      position: relative;
      z-index: 1;

      text-align: center;

      color: #64748b;

      font-size: 8px;

      margin-top: 5px;
    }

    .particle {
      position: fixed;

      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: #93c5fd;

      pointer-events: none;

      z-index: 99999;

      animation:
        particle .45s ease-out
        forwards;
    }

    @keyframes particle {
      0% {
        transform:
          translate(0, 0)
          scale(1);

        opacity: 1;
      }

      100% {
        transform:
          translate(
            var(--dx),
            var(--dy)
          )
          scale(.3);

        opacity: 0;
      }
    }

    .screen-flash {
      position: fixed;

      inset: 0;

      background:
        radial-gradient(
          circle,
          rgba(59,130,246,.08),
          transparent 55%
        );

      pointer-events: none;

      opacity: 0;

      z-index: 9990;
    }

    .screen-flash.active {
      animation:
        screenFlash .22s ease;
    }

    @keyframes screenFlash {
      0% {
        opacity: 0;
      }

      35% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }

  </style>
</head>

<body>

<div
  class="screen-flash"
  id="screenFlash"
></div>

<div class="app">

  <header>

    <div>

      <h1>
        🎵 Soundboard
      </h1>

      <div class="subtitle">
        Compact • haptic • FX
      </div>

    </div>

    <button
      class="add fx-button"
      id="addButton"
    >
      ＋ Son
    </button>

  </header>


  <div
    class="drop"
    id="dropZone"
  >
    🎵 Glisse un son ici ou clique
  </div>


  <input
    id="fileInput"
    type="file"
    accept="audio/*"
    multiple
    hidden
  >


  <div class="controls">

    <span>
      🔊
    </span>

    <input
      id="volume"
      type="range"
      min="0"
      max="1"
      step="0.01"
      value="0.8"
    >

    <button
      class="stop fx-button"
      id="stopButton"
    >
      ■ Stop
    </button>

  </div>


  <div
    class="sounds"
    id="sounds"
  ></div>


  <footer>
    Échap = arrêter
  </footer>

</div>


<script>

const DATABASE_NAME =
  "MiniSoundboard";

const STORE_NAME =
  "sounds";

let database;

let volume = 0.8;

let playingSounds =
  new Set();

let shortcutCapture =
  null;


/* HAPTIC */

function haptic(
  pattern = 12
) {

  if (
    "vibrate" in navigator
  ) {

    navigator.vibrate(
      pattern
    );

  }

}


/* RIPPLE */

function makeRipple(
  button,
  event
) {

  const rect =
    button
      .getBoundingClientRect();

  const x =
    event.clientX -
    rect.left;

  const y =
    event.clientY -
    rect.top;

  button.style
    .setProperty(
      "--ripple-x",
      x + "px"
    );

  button.style
    .setProperty(
      "--ripple-y",
      y + "px"
    );

  button.classList
    .remove(
      "ripple"
    );

  void button.offsetWidth;

  button.classList
    .add(
      "ripple"
    );

}


/* BUTTON FEEL */

document
  .addEventListener(
    "pointerdown",
    (event) => {

      const button =
        event.target.closest(
          "button"
        );

      if (!button) {
        return;
      }

      haptic(10);

      makeRipple(
        button,
        event
      );

      button.classList
        .add(
          "pressed"
        );

    }
  );


document
  .addEventListener(
    "pointerup",
    (event) => {

      const button =
        event.target.closest(
          "button"
        );

      if (!button) {
        return;
      }

      button.classList
        .remove(
          "pressed"
        );

    }
  );


document
  .addEventListener(
    "pointercancel",
    (event) => {

      const button =
        event.target.closest(
          "button"
        );

      if (!button) {
        return;
      }

      button.classList
        .remove(
          "pressed"
        );

    }
  );


/* SCREEN FLASH */

function flashScreen() {

  const flash =
    document.getElementById(
      "screenFlash"
    );

  flash.classList
    .remove(
      "active"
    );

  void flash.offsetWidth;

  flash.classList
    .add(
      "active"
    );

}


/* PARTICLES */

function particlesFrom(
  element
) {

  const rect =
    element
      .getBoundingClientRect();

  const centerX =
    rect.left +
    rect.width / 2;

  const centerY =
    rect.top +
    rect.height / 2;

  for (
    let i = 0;
    i < 7;
    i++
  ) {

    const particle =
      document.createElement(
        "div"
      );

    particle.className =
      "particle";

    particle.style.left =
      centerX + "px";

    particle.style.top =
      centerY + "px";

    const angle =
      Math.random() *
      Math.PI *
      2;

    const distance =
      18 +
      Math.random() *
      24;

    const dx =
      Math.cos(angle) *
      distance;

    const dy =
      Math.sin(angle) *
      distance;

    particle.style
      .setProperty(
        "--dx",
        dx + "px"
      );

    particle.style
      .setProperty(
        "--dy",
        dy + "px"
      );

    document.body
      .appendChild(
        particle
      );

    setTimeout(
      () => {
        particle.remove();
      },
      500
    );

  }

}


/* DATABASE */

function openDatabase() {

  return new Promise(
    (resolve, reject) => {

      const request =
        indexedDB.open(
          DATABASE_NAME,
          2
        );

      request.onupgradeneeded =
        function() {

          const db =
            request.result;

          if (
            !db
              .objectStoreNames
              .contains(
                STORE_NAME
              )
          ) {

            db.createObjectStore(
              STORE_NAME,
              {
                keyPath: "id",
                autoIncrement: true
              }
            );

          }

        };

      request.onsuccess =
        function() {

          database =
            request.result;

          resolve();

        };

      request.onerror =
        function() {

          reject(
            request.error
          );

        };

    }
  );

}


/* GET SOUNDS */

function getSounds() {

  return new Promise(
    (resolve, reject) => {

      const transaction =
        database.transaction(
          STORE_NAME,
          "readonly"
        );

      const store =
        transaction
          .objectStore(
            STORE_NAME
          );

      const request =
        store.getAll();

      request.onsuccess =
        () =>
          resolve(
            request.result
          );

      request.onerror =
        () =>
          reject(
            request.error
          );

    }
  );

}


/* SAVE */

function saveSound(
  sound
) {

  return new Promise(
    (resolve, reject) => {

      const transaction =
        database.transaction(
          STORE_NAME,
          "readwrite"
        );

      const store =
        transaction
          .objectStore(
            STORE_NAME
          );

      const request =
        store.put(
          sound
        );

      request.onsuccess =
        resolve;

      request.onerror =
        () =>
          reject(
            request.error
          );

    }
  );

}


/* DELETE */

function deleteSound(
  id
) {

  haptic(
    [20, 25, 20]
  );

  const transaction =
    database.transaction(
      STORE_NAME,
      "readwrite"
    );

  transaction
    .objectStore(
      STORE_NAME
    )
    .delete(
      id
    );

  setTimeout(
    renderSounds,
    100
  );

}


/* SHORTCUT */

function normalizeKey(
  event
) {

  return {

    key:
      event
        .key
        .toLowerCase(),

    ctrl:
      event.ctrlKey,

    alt:
      event.altKey,

    shift:
      event.shiftKey,

    meta:
      event.metaKey

  };

}


function shortcutText(
  shortcut
) {

  if (!shortcut) {
    return "—";
  }

  const parts = [];

  if (
    shortcut.ctrl
  ) {
    parts.push(
      "Ctrl"
    );
  }

  if (
    shortcut.alt
  ) {
    parts.push(
      "Alt"
    );
  }

  if (
    shortcut.shift
  ) {
    parts.push(
      "Shift"
    );
  }

  if (
    shortcut.meta
  ) {
    parts.push(
      "⌘"
    );
  }

  parts.push(
    shortcut.key
  );

  return parts.join(
    "+"
  );

}


function sameShortcut(
  a,
  b
) {

  if (
    !a ||
    !b
  ) {

    return false;

  }

  return (
    a.key === b.key &&
    a.ctrl === b.ctrl &&
    a.alt === b.alt &&
    a.shift === b.shift &&
    a.meta === b.meta
  );

}


/* PLAY */

function playSound(
  sound,
  button,
  row
) {

  haptic(
    [12, 15, 8]
  );

  flashScreen();

  particlesFrom(
    button
  );

  button.classList
    .remove(
      "flash"
    );

  void button.offsetWidth;

  button.classList
    .add(
      "flash"
    );

  row.classList
    .remove(
      "playing"
    );

  void row.offsetWidth;

  row.classList
    .add(
      "playing"
    );


  const url =
    URL.createObjectURL(
      sound.blob
    );

  const audio =
    new Audio(
      url
    );

  audio.volume =
    volume;

  playingSounds.add(
    audio
  );

  audio.onended =
    function() {

      playingSounds.delete(
        audio
      );

      URL.revokeObjectURL(
        url
      );

      row.classList
        .remove(
          "playing"
        );

    };

  audio.play();

}


/* ADD FILES */

async function addFiles(
  files
) {

  for (
    const file of files
  ) {

    if (
      !file.type
        .startsWith(
          "audio/"
        )
    ) {

      continue;

    }

    const name =
      file.name.replace(
        /\.[^/.]+$/,
        ""
      );

    await saveSound(
      {
        name:
          name,

        blob:
          file,

        shortcut:
          null
      }
    );

  }

  haptic(
    [15, 20, 15]
  );

  renderSounds();

}


/* DISPLAY */

async function renderSounds() {

  const container =
    document.getElementById(
      "sounds"
    );

  const sounds =
    await getSounds();

  container.innerHTML =
    "";

  if (
    sounds.length === 0
  ) {

    container.innerHTML =
      '<div class="empty">Aucun son</div>';

    return;

  }

  for (
    const sound
    of sounds
  ) {

    const row =
      document.createElement(
        "div"
      );

    row.className =
      "sound";


    const play =
      document.createElement(
        "button"
      );

    play.className =
      "play";

    play.textContent =
      "▶ " +
      sound.name;

    play.onclick =
      () =>
        playSound(
          sound,
          play,
          row
        );


    const shortcut =
      document.createElement(
        "button"
      );

    shortcut.className =
      "shortcut";

    shortcut.textContent =
      shortcutText(
        sound.shortcut
      );

    shortcut.onclick =
      () => {

        shortcutCapture =
          sound.id;

        shortcut.textContent =
          "Appuie";

        haptic(15);

      };


    const edit =
      document.createElement(
        "button"
      );

    edit.className =
      "edit";

    edit.textContent =
      "✎";

    edit.onclick =
      () => {

        row.classList
          .toggle(
            "editing"
          );

      };


    const remove =
      document.createElement(
        "button"
      );

    remove.className =
      "delete";

    remove.textContent =
      "×";

    remove.onclick =
      () =>
        deleteSound(
          sound.id
        );


    const editArea =
      document.createElement(
        "div"
      );

    editArea.className =
      "edit-area";


    const nameInput =
      document.createElement(
        "input"
      );

    nameInput.value =
      sound.name;


    const save =
      document.createElement(
        "button"
      );

    save.className =
      "edit";

    save.textContent =
      "OK";

    save.onclick =
      async () => {

        sound.name =
          nameInput.value
            .trim()
          || "Son";

        await saveSound(
          sound
        );

        haptic(12);

        renderSounds();

      };


    editArea.append(
      nameInput,
      save
    );


    row.append(
      play,
      shortcut,
      edit,
      remove,
      editArea
    );

    container.appendChild(
      row
    );

  }

}


/* ADD */

document
  .getElementById(
    "addButton"
  )
  .onclick =
  () => {

    document
      .getElementById(
        "fileInput"
      )
      .click();

  };


/* FILE */

document
  .getElementById(
    "fileInput"
  )
  .onchange =
  e =>
    addFiles(
      e.target.files
    );


/* VOLUME */

document
  .getElementById(
    "volume"
  )
  .oninput =
  e => {

    volume =
      Number(
        e.target.value
      );

    haptic(4);

  };


/* STOP */

document
  .getElementById(
    "stopButton"
  )
  .onclick =
  () => {

    haptic(
      [20, 30, 20]
    );

    for (
      const audio
      of playingSounds
    ) {

      audio.pause();

      audio.currentTime =
        0;

    }

    playingSounds.clear();

    document
      .querySelectorAll(
        ".sound.playing"
      )
      .forEach(
        row =>
          row.classList
            .remove(
              "playing"
            )
      );

  };


/* DRAG */

const dropZone =
  document
    .getElementById(
      "dropZone"
    );

dropZone.onclick =
  () => {

    haptic(8);

    document
      .getElementById(
        "fileInput"
      )
      .click();

  };


dropZone.ondragover =
  e => {

    e.preventDefault();

    dropZone.classList
      .add(
        "over"
      );

  };


dropZone.ondragleave =
  () => {

    dropZone.classList
      .remove(
        "over"
      );

  };


dropZone.ondrop =
  e => {

    e.preventDefault();

    dropZone.classList
      .remove(
        "over"
      );

    addFiles(
      e.dataTransfer.files
    );

  };


/* KEYBOARD */

document.addEventListener(
  "keydown",
  async function(
    event
  ) {

    if (
      event.key ===
      "Escape"
    ) {

      document
        .getElementById(
          "stopButton"
        )
        .click();

      return;

    }


    if (
      shortcutCapture !==
      null
    ) {

      event.preventDefault();

      const sounds =
        await getSounds();

      const sound =
        sounds.find(
          s =>
            s.id ===
            shortcutCapture
        );

      if (sound) {

        sound.shortcut =
          normalizeKey(
            event
          );

        await saveSound(
          sound
        );

        haptic(
          [10, 15, 10]
        );

      }

      shortcutCapture =
        null;

      renderSounds();

      return;

    }


    const pressed =
      normalizeKey(
        event
      );

    const sounds =
      await getSounds();

    const sound =
      sounds.find(
        s =>
          sameShortcut(
            s.shortcut,
            pressed
          )
      );

    if (sound) {

      event.preventDefault();

      const rows =
        Array.from(
          document
            .querySelectorAll(
              ".sound"
            )
        );

      const index =
        sounds.findIndex(
          s =>
            s.id ===
            sound.id
        );

      const row =
        rows[index];

      const button =
        row
          ?.querySelector(
            ".play"
          );

      if (
        button &&
        row
      ) {

        playSound(
          sound,
          button,
          row
        );

      }

    }

  }
);


/* START */

openDatabase()
  .then(
    renderSounds
  );


/* SERVICE WORKER */

if (
  "serviceWorker"
  in navigator
) {

  navigator
    .serviceWorker
    .register(
      "./sw.js"
    );

}

</script>

</body>
</html>
